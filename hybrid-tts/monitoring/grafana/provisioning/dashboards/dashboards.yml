# Grafana dashboard provisioning for Hybrid TTS
apiVersion: 1

providers:
  - name: 'Hybrid TTS Dashboards'
    orgId: 1
    folder: 'Hybrid TTS'
    folderUid: 'hybrid-tts'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
