version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: hybrid-tts-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build: .
    container_name: hybrid-tts-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - ./cache/storage:/app/hybrid-tts/cache/storage
      - ./logs:/app/hybrid-tts/logs
      - ./templates/data:/app/hybrid-tts/templates/data
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis_data:
